# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# nginx.conf — Memory Palace OS 反向代理 + SSL 终止
# 适配 FastAPI（支持 WebSocket、大请求体）
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 日志格式（含响应时间，便于 SLA 分析）──────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ── 安全头 ──────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── 隐藏 nginx 版本 ──────────────────────────────────────────
    server_tokens off;

    # ── 限流（企微 Webhook 防刷）────────────────────────────────
    # 同一 IP 每秒最多 20 个请求，超出排队；burst 50 应对瞬时峰值
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=20r/s;

    # ── upstream：指向 docker-compose 内的 app 服务 ─────────────
    upstream fastapi_app {
        server app:8000;
        keepalive 16;                  # 复用连接，减少握手开销
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # HTTP → HTTPS 强制跳转
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    server {
        listen 80;
        server_name _;

        # 企微服务器验证时走 HTTP（企微不强制 HTTPS 回调）
        # 如果你的企微回调已配置 HTTPS，可删除此 location 改为全跳转
        location /webhook {
            return 301 https://$host$request_uri;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # HTTPS 主服务
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    server {
        listen 443 ssl;
        http2  on;
        server_name _;                 # 替换为你的实际域名

        # ── SSL 证书（挂载自 deploy/ssl/）────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── SSL 安全配置 ─────────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # ── 请求体大小（企微图片/文件消息最大 20MB）──────────────
        client_max_body_size 20M;

        # ── 超时设置（LLM 调用可能较慢，给足时间）───────────────
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;

        # ── 通用 proxy 头（FastAPI 需要正确的 IP 和协议）────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";   # 启用 keepalive

        # ── 企微 Webhook（限流保护）──────────────────────────────
        location /webhook {
            limit_req zone=webhook burst=50 nodelay;
            proxy_pass http://fastapi_app;
        }

        # ── 健康检查（运维探针，不限流）─────────────────────────
        location /health {
            proxy_pass http://fastapi_app;
            access_log off;            # 健康检查不记日志，减少噪音
        }

        # ── 管理大屏（仅内网 IP 可访问，按需开启）───────────────
        location /admin {
            # 生产环境建议限制来源 IP：
            # allow 192.168.0.0/16;
            # deny  all;
            proxy_pass http://fastapi_app;
        }

        # ── 其余所有请求 ─────────────────────────────────────────
        location / {
            proxy_pass http://fastapi_app;
        }
    }
}

    