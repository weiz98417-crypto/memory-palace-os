# =============================================================================
# Memory Palace OS - Prometheus 配置
# =============================================================================
# 全局配置、告警规则、监控目标
# =============================================================================

global:
  # 全局采集间隔 (默认 15s)
  scrape_interval: 15s
  # 评估告警规则间隔
  evaluation_interval: 15s
  # 外部系统标签 (可用于区分环境)
  external_labels:
    cluster: 'memory-palace-prod'
    environment: 'production'
    project: 'memory-palace-os'

# =============================================================================
# 告警管理器配置
# =============================================================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      # 等待告警管理器就绪超时
      timeout: 10s

# =============================================================================
# 规则文件 (告警规则定义)
# =============================================================================
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# =============================================================================
# 监控目标配置
# =============================================================================
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus 自身监控
  # ---------------------------------------------------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: '${1}'

  # ---------------------------------------------------------------------------
  # Memory Palace 应用指标 (核心业务)
  # ---------------------------------------------------------------------------
  - job_name: 'memory-palace-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    # HTTP 基础认证
    basic_auth:
      username: '${PROMETHEUS_USER:-prometheus}'
      password: '${PROMETHEUS_PASSWORD:-}'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: 'memory-palace-api-${1}'
      # 添加服务标签
      - source_labels: [__address__]
        target_label: service
        replacement: 'memory-palace-api'
      # 标记为高优先级采集
      - source_labels: [__address__]
        target_label: priority
        replacement: 'high'

  # ---------------------------------------------------------------------------
  # 健康检查端点
  # ---------------------------------------------------------------------------
  - job_name: 'memory-palace-health'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/health'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ---------------------------------------------------------------------------
  # 消息队列指标 (Redis/Queue)
  # ---------------------------------------------------------------------------
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: 'redis-${1}'
      - source_labels: [__address__]
        target_label: service
        replacement: 'redis'

  # ---------------------------------------------------------------------------
  # 主机级监控 (node-exporter)
  # ---------------------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: 'host-${1}'

  # ---------------------------------------------------------------------------
  # 容器级监控 (cadvisor)
  # ---------------------------------------------------------------------------
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    scrape_timeout: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):\d+'
        replacement: 'container-host'

  # ---------------------------------------------------------------------------
  # Grafana 监控
  # ---------------------------------------------------------------------------
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'
    scrape_interval: 60s

