name: memory-palace-demo

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    image: memory-palace-os:demo
    environment:
      APP_ENV: demo
      DEMO_MODE: "true"
      LOG_LEVEL: INFO
      DATABASE_PATH: /app/data/memory.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      USE_REDIS: "false"
      METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:${DEMO_PORT:-8000}:8000"
    volumes:
      - demo-data:/app/data
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

volumes:
  demo-data:
    name: memory-palace-demo-data
