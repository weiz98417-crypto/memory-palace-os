name: memory-palace-monitoring

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: [../.env]
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-mp_user}@postgres:5432/${POSTGRES_DB:-memory_palace}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      BGE_M3_MODEL_PATH: BAAI/bge-m3
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      HF_HOME: /models/huggingface
      SCENIC_ACCOUNT_PASSWORD_FILE: /run/memory-palace-secrets/scenic_account_password
    volumes:
      - app-data:/app/data
      - ${BGE_M3_CACHE_DIR:?BGE_M3_CACHE_DIR is required}:/models/huggingface:ro
      - app-secrets:/run/memory-palace-secrets:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s

  postgres:
    image: pgvector/pgvector:0.8.1-pg15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory_palace}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mp_user} -d ${POSTGRES_DB:-memory_palace}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  nginx:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8090}:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      app: {condition: service_healthy}
    networks: [internal, external]

volumes:
  app-data:
  pg-data:
  redis-data:
  nginx-logs:
  app-secrets:
    external: true
    name: ${MEMORY_PALACE_SECRETS_VOLUME:-memory-palace-secrets}

networks:
  internal:
    internal: true
  external:
