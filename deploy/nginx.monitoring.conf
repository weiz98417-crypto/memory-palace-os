# =============================================================================
# Memory Palace OS - 监控面板 Nginx 反向代理配置
# =============================================================================
# 包含: Prometheus / Grafana / Alertmanager / Node-Exporter 统一入口
# 使用: 复制到 /etc/nginx/conf.d/memory-palace-monitoring.conf
# =============================================================================

# =============================================================================
# 全局配置
# =============================================================================
upstream prometheus_backend {
    server prometheus:9090 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream grafana_backend {
    server grafana:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream alertmanager_backend {
    server alertmanager:9093 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream nodeexporter_backend {
    server node-exporter:9100 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream cadvisor_backend {
    server cadvisor:8080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# =============================================================================
# HTTP → HTTPS 重定向
# =============================================================================
server {
    listen 80;
    server_name
        monitor.memory-palace.com
        prometheus.memory-palace.com
        grafana.memory-palace.com
        alert.memory-palace.com
       监控.*.memory-palace.com;

    # Let's Encrypt 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # 所有其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# 主监控入口 (monitor.memory-palace.com)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name monitor.memory-palace.com;

    # SSL 配置
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # TLS 1.3
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/vndrometheus.api.v2+json;

    # IP 白名单 (可选 - 限制内网访问)
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;

    # -----------------------------------------------------------------------
    # Prometheus 监控面板
    # -----------------------------------------------------------------------
    location /prometheus/ {
        proxy_pass http://prometheus_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 限流: 每分钟 100 请求
        limit_req zone=monitor_api burst=20 nodelay;
    }

    # -----------------------------------------------------------------------
    # Grafana 仪表盘
    # -----------------------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 支持 (实时告警)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长时间连接
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲关闭 (Grafana 需要实时推送)
        proxy_buffering off;

        # Cookie 透传
        proxy_pass_header Set-Cookie;
    }

    # -----------------------------------------------------------------------
    # Alertmanager 告警管理
    # -----------------------------------------------------------------------
    location /alertmanager/ {
        proxy_pass http://alertmanager_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------------------------------------------------
    # 监控首页 (Grafana 默认面板)
    # -----------------------------------------------------------------------
    location / {
        return 302 /grafana/;
    }

    # -----------------------------------------------------------------------
    # 健康检查端点 (Nginx 自身)
    # -----------------------------------------------------------------------
    location /nginx_health {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------------------
    # 限流配置
    # -----------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=monitor_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=monitor_strict:1m rate=1r/s;

    # -----------------------------------------------------------------------
    # 日志配置
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/monitor.access.log json_combined;
    error_log /var/log/nginx/monitor.error.log warn;
}

# =============================================================================
# Prometheus 独立入口 (可选)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name prometheus.memory-palace.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

    location / {
        proxy_pass http://prometheus_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

