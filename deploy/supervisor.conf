━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; supervisor.conf — Memory Palace OS 进程守护
;
; 用途：在不使用 Docker 的裸机/虚拟机部署时，用 supervisord
;       管理 gunicorn 进程，实现崩溃自重启、日志归档。
;       Docker 环境下 restart: unless-stopped 已覆盖此需求，
;       此文件作为备用方案保留。
;
; 安装：
;   pip install supervisor
;   cp deploy/supervisor.conf /etc/supervisor/conf.d/memory-palace.conf
;   supervisorctl reread && supervisorctl update
;
; 常用命令：
;   supervisorctl status
;   supervisorctl restart memory-palace-app
;   supervisorctl tail -f memory-palace-app
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid

; ── supervisorctl RPC 接口 ──────────────────────────────────────
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock


; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; 主应用：FastAPI via Gunicorn + UvicornWorker
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[program:memory-palace-app]
command=/opt/venv/bin/gunicorn main:app
    -k uvicorn.workers.UvicornWorker
    -w 1
    --bind 0.0.0.0:8000
    --timeout 120
    --keep-alive 5
    --forwarded-allow-ips *
    --access-logfile -
    --error-logfile -

directory=/opt/memory-palace-os          ; 项目根目录，按实际路径修改
user=appuser                             ; 非 root 用户运行
autostart=true                           ; supervisord 启动时自动拉起
autorestart=true                         ; 崩溃后自动重启
startretries=5                           ; 最多重试 5 次，超出则 FATAL
startsecs=5                              ; 启动后稳定 5 秒才算成功

; 环境变量：从 .env 文件加载（裸机部署时手动指定路径）
environment=
    APP_ENV="production",
    LOG_LEVEL="INFO",
    DB_PATH="/opt/memory-palace-os/data/memory.db",
    LOG_DIR="/opt/memory-palace-os/data/logs"

; 日志（stdout/stderr 统一归到 loguru 自管的日志文件）
stdout_logfile=/opt/memory-palace-os/data/logs/supervisor_app.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/opt/memory-palace-os/data/logs/supervisor_app_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

; 优雅关机：先发 SIGTERM，等 30 秒队列排空，再发 SIGKILL
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
stopasgroup=true


; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
; 进程组（方便一键重启所有服务）
; supervisorctl restart memory-palace:*
; ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[group:memory-palace]
programs=memory-palace-app

    