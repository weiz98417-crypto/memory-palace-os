version: "3.9"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Memory Palace OS — Docker Compose
# 服务：app（FastAPI）+ chromadb + nginx
# SQLite 文件直接挂载到宿主机，无需独立容器
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:

  # ── 主应用（FastAPI + Gunicorn）────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: memory-palace-app
    restart: unless-stopped
    env_file:
      - ../.env                       # 真实密钥从 .env 注入，不进镜像
    environment:
      # ChromaDB 连接地址（容器内服务名）
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8001"
      # PostgreSQL 连接
      DATABASE_URL: postgresql://mp_user:mp_pass@postgres:5432/memory_palace
      # Redis 连接
      REDIS_URL: redis://redis:6379
      # SQLite 路径映射到挂载卷（DEMO_MODE 兜底）
      DB_PATH: /app/data/memory.db
      LOG_DIR: /app/data/logs
    volumes:
      - sqlite-data:/app/data          # SQLite + 日志持久化
      - workspaces-data:/app/data/workspaces  # [Phase 4] 工作区隔离
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - internal
    # 不对外暴露端口，由 nginx 代理
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── PostgreSQL 数据库 ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: memory-palace-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory_palace
      POSTGRES_USER: mp_user
      POSTGRES_PASSWORD: mp_pass
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp_user -d memory_palace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 消息队列 ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: memory-palace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - internal
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库 ─────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: memory-palace-chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE      # 关闭遥测，本地部署隐私优先
    volumes:
      - chroma-data:/chroma/chroma      # 向量数据持久化
    networks:
      - internal
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Nginx 反向代理 ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: memory-palace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro         # SSL 证书目录（宿主机挂载）
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      - external

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 持久化卷
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
  sqlite-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data                   # 映射到宿主机 deploy/data/，方便备份
  workspaces-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/workspaces        # [Phase 4] 工作区隔离目录
  chroma-data:
    driver: local
  nginx-logs:
    driver: local

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 网络隔离：internal 仅容器间通信，external 对外
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
networks:
  internal:
    driver: bridge
    internal: true                     # ChromaDB 和 app 不直接暴露公网
  external:
    driver: bridge

    