name: memory-palace-mvp

services:
  attachment-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - chown -R appuser:appuser /app/data/attachments && chmod 0750 /app/data/attachments
    volumes:
      - attachment-data:/app/data/attachments
    network_mode: none
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DEMO_MODE: "false"
      DEEPSEEK_API_KEY_FILE: /run/memory-palace-secrets/deepseek_api_key
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      LLM_DEFAULT_MODEL: deepseek-v4-flash
      MEMORY_PALACE_JWT_SECRET: ${MEMORY_PALACE_JWT_SECRET:?MEMORY_PALACE_JWT_SECRET is required}
      MEMORY_PALACE_API_KEYS: ${MEMORY_PALACE_API_KEYS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-系统管理员}
      MEMORY_PALACE_UAT_BASE_URL: http://localhost:8000
      UAT_EMPLOYEE_PASSWORD_FILE: /run/memory-palace-secrets/uat_employee_password
      DEFAULT_VENUE_ID: ${DEFAULT_VENUE_ID:-venue-hq}
      DEFAULT_VENUE_NAME: ${DEFAULT_VENUE_NAME:-示范景区运营中心}
      WECHAT_CORP_ID: ${WECHAT_CORP_ID:-}
      WECHAT_CORP_SECRET: ${WECHAT_CORP_SECRET:-}
      WECHAT_AGENT_ID: ${WECHAT_AGENT_ID:-}
      WECHAT_TOKEN: ${WECHAT_TOKEN:-}
      WECHAT_ENCODING_AES_KEY: ${WECHAT_ENCODING_AES_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      ALERT_PHONES: ${ALERT_PHONES:-}

      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-mp_user}@postgres:5432/${POSTGRES_DB:-memory_palace}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "true"
      LOG_DIR: /app/data/logs
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
    volumes:
      - app-logs:/app/data/logs
      - attachment-data:/app/data/attachments
      - workspaces-data:/app/data/workspaces
      - embedding-cache:/home/appuser/.cache
      - app-secrets:/run/memory-palace-secrets:ro
    depends_on:
      attachment-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - data-plane
      - egress
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:15.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memory_palace}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - data-plane
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mp_user} -d ${POSTGRES_DB:-memory_palace}"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    networks:
      - data-plane
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true

  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - data-plane
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - data-plane
      - egress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  pg-data:
  redis-data:
  chroma-data:
  app-logs:
  attachment-data:
  workspaces-data:
  embedding-cache:
  nginx-logs:
  app-secrets:
    external: true
    name: ${MEMORY_PALACE_SECRETS_VOLUME:-memory-palace-secrets}

networks:
  data-plane:
    internal: true
  egress:
