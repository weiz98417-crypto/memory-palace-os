scenario: emergency
label: "突发事件演练"

knowledge:
  - content: "SOP-游客受伤处置流程：①接到报告后立即通知医务室(分机101)和安保部(分机201) ②安保人员3分钟内赶到现场维持秩序 ③医务室人员5分钟内到达进行初步检查 ④如伤情严重立即拨打120并安排人员在景区入口引导救护车 ⑤同时通知景区管理处启动应急预案 ⑥事后24小时内提交事故报告。"
    metadata: {category: "SOP", keywords: ["受伤", "急救", "医务", "事故", "安全"]}
  - content: "SOP-老人/儿童走失处置流程：①接到报告后立即记录走失者特征(年龄、衣着、最后出现位置) ②通过对讲机通知所有安保人员 ③安排人员在游客中心和广播室协助 ④查看最近30分钟监控录像 ⑤必要时报警并通知景区管理处 ⑥找到后安抚情绪并提供帮助。"
    metadata: {category: "SOP", keywords: ["走失", "老人", "儿童", "丢失", "寻找"]}
  - content: "SOP-极端天气应对流程：①接到气象预警后立即评估风险等级(黄色/橙色/红色) ②橙色及以上预警时启动闭园预案 ③通知广播室循环播放疏散通知 ④安排人员在缆车、栈道等高风险区域引导游客撤离 ⑤开放室内场馆作为临时避难所 ⑥储备应急物资(毛毯、热水、食物) ⑦天气好转后恢复开放前进行全面安全排查。"
    metadata: {category: "SOP", keywords: ["天气", "暴雨", "台风", "雷电", "疏散", "闭园"]}
  - content: "SOP-火灾应急流程：①发现火情立即按下最近的火警按钮 ②安保部确认火情后拨打119 ③启动消防广播引导游客沿疏散通道撤离 ④微型消防站队员3分钟内到达现场使用灭火器进行初期扑救 ⑤各岗位人员引导游客到指定集合点 ⑥清点人数，如有失踪立即报告消防队。"
    metadata: {category: "SOP", keywords: ["火灾", "火警", "消防", "灭火", "疏散通道"]}
  - content: "SOP-大面积停电应对流程：①立即启动备用发电机(自动切换，30秒内恢复) ②通知各岗位打开应急照明 ③安排人员在电梯口、楼梯间引导游客 ④特别关注缆车系统——备用电源仅支持将乘客送回最近站点 ⑤通知供电局抢修 ⑥修复后逐步恢复供电，优先保障医疗和消防系统。"
    metadata: {category: "SOP", keywords: ["停电", "断电", "备用电源", "应急"]}
  - content: "景区应急物资清单：急救箱(每100米一个)、AED自动体外除颤器(中心广场+南北门+缆车站共5台)、灭火器(每50米一个)、应急照明灯(每30米一个)、对讲机(全员配备，备用电池每岗2块)、担架(医务室2副)、救生圈(水域周边每20米一个)。"
    metadata: {category: "物资", keywords: ["物资", "急救箱", "AED", "灭火器", "装备", "应急物资"]}
  - content: "景区疏散集合点：共有4个指定疏散集合点——北停车场、南门广场、中心广场空地、西门草坪。各区域岗位人员负责引导游客到最近的集合点。每个集合点有指示牌和应急物资柜。"
    metadata: {category: "疏散", keywords: ["集合点", "疏散", "逃生", "安全区域"]}
  - content: "紧急联系电话：医务室分机101、安保部分机201、景区管理处302、消防119、急救120、报警110。景区24小时应急热线：400-XXX-XXXX。各岗位人员手机号已录入通讯录，紧急时可通过对讲机6频道直接联络管理处。"
    metadata: {category: "通讯", keywords: ["电话", "紧急联系", "报警", "急救"]}
  - content: "每季度进行一次全员应急演练，内容包括：消防疏散(3月)、医疗急救(6月)、反恐防暴(9月)、自然灾害应对(12月)。每次演练后进行打分复盘，不合格的岗位需补训。去年消防疏散演练从报警到全员集合耗时8分15秒，目标控制在6分钟内。"
    metadata: {category: "演练", keywords: ["演练", "培训", "应急演练", "季度"]}
  - content: "景区安全风险地图：高风险区域——玻璃栈道(防坠落)、缆车站(防机械故障)、飞瀑流泉水域(防溺水)、云海观景台(防风)。中风险区域——千年古寺(防火)、中心广场(防踩踏)。低风险区域——停车场、售票处。各区域风险等级已标注在安保值班地图上，每日交班时确认。"
    metadata: {category: "风险", keywords: ["风险", "高风险", "安全风险", "危险区域"]}

personas:
  - job_title: "景区安保队长"
    years: 12
    logic_entries:
      - trigger: "接到游客受伤报告"
        behavior: "立即用手台通知最近的安保人员赶到现场，同时通知医务室，本人也立即前往"
        reason: "安保人员分布在全园，最近的人能在2分钟内到达，比等医务室人员更快开始处置"
      - trigger: "监控发现可疑人员翻越护栏"
        behavior: "立即通知就近安保人员前往，同时回放该区域前30分钟监控确认是否有同伙"
        reason: "景区扒窃通常是团伙作案，控制一个人的同时要排查其他人"
      - trigger: "闭园后仍有游客未离开"
        behavior: "礼貌告知闭园时间，用巡逻车送游客到最近出口，确保每一位游客安全离开"
        reason: "闭园后留在景区很危险(无照明、无监控覆盖)，必须确保所有人员离场"

  - job_title: "游客中心客服主管"
    years: 8
    logic_entries:
      - trigger: "有游客投诉食物中毒"
        behavior: "立即停止该餐厅出餐，封存食物样本，通知食品安全监督员到场，同时陪同游客去医务室"
        reason: "食品安全事故必须第一时间控制源头和留证，游客健康是第一位"
      - trigger: "接到极端天气预警升级"
        behavior: "立即启动闭园广播，通知各岗位引导游客有序撤离到室内场馆"
        reason: "游客安全高于一切，宁可白关一天不能冒一次险"
      - trigger: "有游客丢失贵重物品情绪激动"
        behavior: "先安抚情绪(坐下、倒水)，再详细了解丢失经过，调取监控，安排专人全程陪同处理"
        reason: "游客情绪稳定才能提供有效信息，陪同处理让游客感到被重视"

todos:
  - goal: "处理景区游客受伤事件的全流程"
    expected_tasks:
      - {description: "安保人员到达现场维持秩序", depends_on: []}
      - {description: "医务室人员进行伤情初步检查", depends_on: [0]}
      - {description: "根据伤情决定是否拨打120", depends_on: [1]}
      - {description: "现场拍照留证", depends_on: [2]}
      - {description: "24小时内提交事故报告", depends_on: [3]}
  - goal: "组织本季度消防疏散演练"
    expected_tasks:
      - {description: "制定演练方案(时间、路线、人员分工)", depends_on: []}
      - {description: "各岗位通知到位并确认参与", depends_on: [0]}
      - {description: "准备演练物资(烟雾弹、计时器、评分表)", depends_on: [0]}
      - {description: "执行演练并记录各环节耗时", depends_on: [1, 2]}
      - {description: "演练复盘会议评分并出具改进方案", depends_on: [3]}
  - goal: "极端天气预警后的闭园准备"
    expected_tasks:
      - {description: "评估气象数据确定风险等级", depends_on: []}
      - {description: "通知广播室录制疏散广播", depends_on: [0]}
      - {description: "安排人员到缆车和栈道区域引导撤离", depends_on: [0]}
      - {description: "开放室内场馆准备避难物资", depends_on: [0]}
      - {description: "确认备用发电机和应急照明就绪", depends_on: []}

preset_messages:
  emergency:
    - {label: "游客受伤(西门)", content: "景区西门有游客摔伤了，腿部出血需要急救"}
    - {label: "老人走失", content: "一位70岁老人在千年古寺附近走散了，穿红色外套，身高约1米6"}
    - {label: "极端天气预警", content: "气象台发布了暴雨橙色预警，预计半小时后到达本区域"}
  daily:
    - {label: "询问应急物资位置", content: "景区里哪里能找到急救箱和AED"}
