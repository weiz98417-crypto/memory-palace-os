scenario: daily
label: "日常运营"

knowledge:
  - content: "景区内共有5家餐厅，分布在东西南北门入口处和中心广场。中心广场的「山水人家」提供本地特色菜，人均消费60-80元。南门「快餐驿站」提供简餐和饮料，适合赶时间的游客。"
    metadata: {category: "餐饮", keywords: ["餐厅", "吃饭", "美食", "餐饮"]}
  - content: "景区每日开放时间为8:00-18:00，旺季(5-10月)延长至19:00。门票成人120元，学生和65岁以上老人半价。建议提前在官网或小程序购票，旺季现场购票排队约30-45分钟。"
    metadata: {category: "票务", keywords: ["门票", "价格", "时间", "开放", "票价"]}
  - content: "景区主要景点包括：飞瀑流泉(落差60米)、千年古寺(唐代建筑)、云海观景台(海拔850米)、玻璃栈道(长200米)。游览全程约4-5小时，建议从西门进东门出。"
    metadata: {category: "景点", keywords: ["景点", "游玩", "游览", "景点介绍"]}
  - content: "景区停车场共4个，车位总数2000个。旺季周末10:00后基本停满，建议9:00前到达或乘坐景区专线公交。停车费小车10元/次，大巴30元/次。"
    metadata: {category: "交通", keywords: ["停车", "交通", "开车", "怎么去"]}
  - content: "景区设有医务室(中心广场)、母婴室(南北门各一个)、行李寄存(东西门)、轮椅租借(免费)、宠物寄存(收费)、失物招领(中心广场游客中心)。"
    metadata: {category: "设施", keywords: ["医务", "母婴", "寄存", "轮椅", "设施"]}
  - content: "景区内禁止吸烟(除指定吸烟区)、禁止无人机飞行(需提前报备)、禁止携带宠物入园。请游客爱护环境，垃圾入桶。禁止在非指定区域露营。"
    metadata: {category: "规定", keywords: ["规定", "禁止", "吸烟", "无人", "宠物"]}
  - content: "景区提供电子导游讲解器(租金20元/次)，支持中英日韩四种语言。另有定时免费导游服务，每天10:00和14:00从游客中心出发。"
    metadata: {category: "服务", keywords: ["导游", "讲解", "讲解器", "服务"]}
  - content: "景区周边酒店推荐：山水度假酒店(4星，步行5分钟)、景区青年旅舍(经济型，步行10分钟)、温泉假日酒店(5星，车程15分钟)。建议旺季提前一周预订。"
    metadata: {category: "住宿", keywords: ["酒店", "住宿", "住", "宾馆"]}
  - content: "最佳游览季节为春秋两季(3-5月、9-11月)，气温适宜，景色最佳。夏季需注意防晒和防蚊虫，冬季山上可能有积雪需穿防滑鞋。"
    metadata: {category: "季节", keywords: ["季节", "天气", "什么时候", "最佳时间"]}
  - content: "景区内有3条推荐游览路线：经典线(4小时，覆盖主要景点)、深度线(6小时，含徒步)、亲子线(3小时，适合带老人小孩)。各路线在导览图上用不同颜色标注。"
    metadata: {category: "路线", keywords: ["路线", "游览路线", "怎么逛", "玩"]}

personas:
  - job_title: "景区安全巡检主管"
    years: 15
    logic_entries:
      - trigger: "每天早上7:00开始值班"
        behavior: "先检查所有消防设备指示灯是否正常，再查看前一晚的监控回放"
        reason: "夜间可能发生设备故障或异常事件，早发现早处理"
      - trigger: "接到游客受伤报告"
        behavior: "立即通知医务室值班人员并亲自带急救包赶到现场"
        reason: "景区面积大，医务室人员可能不熟悉具体位置，有人带路能节省3-5分钟"
      - trigger: "节假日或大型活动前"
        behavior: "提前3天进行全园安全检查，重点排查玻璃栈道护栏、缆车制动、消防通道"
        reason: "人流密度增大会放大任何安全隐患，事前检查比事后处置成本低100倍"

  - job_title: "游客中心客服主管"
    years: 8
    logic_entries:
      - trigger: "游客投诉景区某处卫生状况差"
        behavior: "先安抚游客情绪，立即通知保洁区域负责人，30分钟内拍整改照片反馈给游客"
        reason: "游客要的不是道歉而是解决，30分钟内闭环能挽回80%的差评"
      - trigger: "旺季排队时间超过30分钟"
        behavior: "启动分流预案，增开备用通道，派志愿者给排队游客发放饮用水"
        reason: "排队超过30分钟游客开始焦虑，一瓶水能降温80%的投诉意愿"
      - trigger: "外国游客询问景区信息"
        behavior: "拿出多语言导览手册指给游客看，同时用手势辅助沟通"
        reason: "微笑和肢体语言是全球通用语言，导览手册有图片能解决90%的问题"

  - job_title: "餐饮区域主管"
    years: 6
    logic_entries:
      - trigger: "中午11:30-13:00用餐高峰"
        behavior: "提前30分钟备好预制品，同时开放所有收银台，安排专人引导排队"
        reason: "高峰期出餐速度决定翻台率，每一分钟都意味着收入"
      - trigger: "食材供应商迟到"
        behavior: "立即启用备用供应商名单，同时从邻近餐厅临时调拨关键食材"
        reason: "餐饮不能停，任何一道菜断供都会引发连锁投诉"
      - trigger: "有游客对食物过敏"
        behavior: "立即停止出餐，查看过敏原，提供替代菜品并标注过敏信息"
        reason: "食品安全是红线，过敏反应可能导致医疗急救"

todos:
  - goal: "景区节假日前一周的安全准备"
    expected_tasks:
      - {description: "检查消防设备", depends_on: []}
      - {description: "安排值班人员", depends_on: []}
      - {description: "采购急救药品", depends_on: []}
      - {description: "设备检查和值班完成后出安全检查报告", depends_on: [0, 1]}
  - goal: "旺季游客服务保障方案"
    expected_tasks:
      - {description: "增设临时售票窗口", depends_on: []}
      - {description: "调配志愿者到主要景点", depends_on: []}
      - {description: "补充各休息区的饮用水", depends_on: []}
      - {description: "确保医务室24小时有人值守", depends_on: []}
      - {description: "售票和志愿者到位后进行全流程演练", depends_on: [0, 1]}
  - goal: "处理游客投诉餐厅卫生问题"
    expected_tasks:
      - {description: "联系投诉游客了解具体情况", depends_on: []}
      - {description: "检查涉事餐厅后厨卫生", depends_on: [0]}
      - {description: "拍照留证并出具整改通知", depends_on: [1]}
      - {description: "向游客反馈处理结果并致歉", depends_on: [2]}

preset_messages:
  emergency:
    - {label: "游客受伤", content: "景区西门有游客受伤了，需要紧急处理"}
    - {label: "游客突发疾病", content: "中心广场有一位老人突然感到胸闷头晕"}
  daily:
    - {label: "询问餐厅推荐", content: "景区附近有什么好吃的餐厅推荐吗"}
    - {label: "询问景点介绍", content: "这个景区有什么历史故事和主要景点"}
    - {label: "询问门票价格", content: "景区门票多少钱？学生有优惠吗"}
    - {label: "询问停车信息", content: "开车来景区在哪里停车？停车费多少"}
    - {label: "询问最佳路线", content: "带老人和小孩来玩的话走哪条路线比较好"}
