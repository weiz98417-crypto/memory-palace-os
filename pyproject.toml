 [tool.poetry]
name = "memory-palace-os"
version = "1.0.0"
description = "企业级景区大模型智能体与记忆资产运营中枢 (Enterprise AI Agent Operations System)"
authors = ["ZhouWei <admin@example.com>"]
readme = "README.md"
packages = [{include = "memory_palace", from = "src"}]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"

# 1. Web 框架与异步网关
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.1"}
starlette = "^0.36.3"
httpx = "^0.27.0"

# 2. 企微安全与数据解析
xmltodict = "^0.13.0"
cryptography = "^42.0.5"

# 3. 全局状态与配置管控
pydantic = "^2.6.3"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.1"

# 4. LLM 引擎与 Agent 护栏
openai = "^1.13.3"
tiktoken = "^0.6.0"
tenacity = "^8.2.3"
Jinja2 = "^3.1.3"

# 5. 记忆存储与向量检索
chromadb = "^0.4.24"
sentence-transformers = "^2.5.1"
numpy = "^1.26.4"
SQLAlchemy = "^2.0.28"

# 6. 后台调度与并发中枢
APScheduler = "^3.10.4"
redis = "^5.0.3"
aiosqlite = "^0.20.0"

# 7. 可观测性与运维 (Ops)
loguru = "^0.7.2"
sentry-sdk = "^1.40.6"
prometheus-client = "^0.20.0"

# 8. 工具与辅助
python-multipart = "^0.0.9"
aiofiles = "^23.2.1"

[tool.poetry.group.dev.dependencies]
# 自动化测试
pytest = "^8.0.2"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.5"

# 代码规范与静态类型检查
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.8.0"
flake8 = "^7.0.0"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.Pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src/memory_palace --cov-report=html"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"